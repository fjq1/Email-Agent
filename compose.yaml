name: email-agent

x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CELERY_BROKER_URL: redis://redis:6379/0
  profiles: [app]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 填写 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 填写 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 填写 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init:
    <<: *app
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py init_checkpoints"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    <<: *app
    command: [celery, -A, config, beat, --loglevel=INFO, --schedule=/tmp/email-agent-beat]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
