<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}邮件助理{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #182438; background: #f4f6fa; }
    main { max-width: 1060px; margin: 48px auto; padding: 0 24px; }
    header, .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    section, .card { background: white; border: 1px solid #dce3ee; border-radius: 12px; padding: 24px; margin: 20px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .grid .card { margin: 0; }
    p { line-height: 1.7; } .muted { color: #627084; } .badge { color: #246442; }
    button { background: #2356b6; color: white; border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
    button.secondary { background: #e8edf5; color: #273954; }
    input { box-sizing: border-box; padding: 10px; border: 1px solid #b6c3d5; border-radius: 6px; max-width: 100%; }
    .notice { padding: 14px; background: #e5edf9; border-radius: 6px; margin: 14px 0; }
    a { color: #2356b6; } code { overflow-wrap: anywhere; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 12px 8px; text-align: left; border-bottom: 1px solid #e4e9f2; vertical-align: top; }
    .scroll { overflow-x: auto; }
    select { padding: 9px; border: 1px solid #b6c3d5; border-radius: 6px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .mail-body { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.8; }
    .mail-card { border-top: 1px solid #e4e9f2; padding-top: 20px; margin-top: 20px; }
    nav { display: flex; gap: 18px; margin-bottom: 20px; flex-wrap: wrap; }
  </style>
</head>
<body><main>
  <header><h1>邮件助理</h1>{% if user.is_authenticated %}<div class="row"><span>{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">退出登录</button></form></div>{% endif %}</header>
  {% if user.is_authenticated %}<nav aria-label="主导航"><a href="{% url 'dashboard' %}">我的邮箱</a><a href="{% url 'mailbox_setup' %}">连接配置</a></nav>{% endif %}
  {% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main></body>
</html>
