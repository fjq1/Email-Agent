{% extends "email_agent/base.html" %}
{% block title %}登录 · 邮件助理{% endblock %}
{% block content %}
<section class="login-card">
  <span class="brand-mark"><svg class="icon"><use href="#i-mail"/></svg></span>
  <p class="eyebrow">WELCOME BACK</p>
  <h1>登录邮件助理</h1>
  <p class="muted">整理邮件，掌握每一步。使用已创建的账号登录。</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">登录</button>
  </form>
</section>
{% endblock %}
